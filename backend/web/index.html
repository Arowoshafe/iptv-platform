<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel catalog</title>
<style>
:root {
    color-scheme: dark;
    font-family: system-ui, -apple-system, sans-serif;
    color: #edf4f8;
    background: #0a1018;
    --surface: #111d2a;
    --edge: #304352;
    --muted: #aebfcb;
    --accent: #90e3cf;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
a { color: var(--accent); text-underline-offset: 4px; }
a, button, input, select { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.shell { width: min(1200px, calc(100% - 48px)); margin: auto; }
.site-header { border-bottom: 1px solid var(--edge); background: #0d1721; }
.top { min-height: 68px; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.brand { font-weight: 800; letter-spacing: -.02em; color: #edf4f8; text-decoration: none; }
.brand-mark { color: var(--accent); margin-right: 5px; }
nav { display: flex; flex-wrap: wrap; gap: 18px; }
nav a { color: var(--muted); font-size: .9rem; }
nav a[aria-current] { color: var(--accent); }
.intro { padding: clamp(32px, 6vw, 65px) 0 24px; }
h1 { margin: 0 0 8px; font-size: clamp(2.5rem, 6vw, 4.3rem); letter-spacing: -.055em; line-height: 1; }
p { color: var(--muted); line-height: 1.5; }
.intro p { margin: 0; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 280px); align-items: start; gap: 24px; }
.catalog, .account { min-width: 0; }
.account { padding: 20px; border: 1px solid var(--edge); border-radius: 16px; background: var(--surface); }
.account h2 { margin: 0 0 16px; font-size: 1.15rem; }
.account form { display: grid; gap: 12px; }
.account label, .field { display: grid; min-width: 0; gap: 6px; font-size: .88rem; font-weight: 650; }
.account input, .field input, .field select {
    width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid #506374;
    border-radius: 8px; background: #091521; color: inherit; font: inherit;
}
button {
    font: inherit; font-weight: 700; color: #0b231f; background: var(--accent);
    border: 1px solid transparent; border-radius: 8px; padding: 9px 12px; cursor: pointer;
}
button:disabled { cursor: default; opacity: .55; }
.account [role=status]:not(:empty) { margin-top: 10px; overflow-wrap: anywhere; color: var(--muted); font-size: .9rem; }
.toolbar { display: grid; grid-template-columns: minmax(150px, .9fr) minmax(150px, 1.2fr) auto; gap: 12px; align-items: end; }
.favorites-filter { display: flex; align-items: center; gap: 6px; padding: 10px 2px; font-size: .88rem; font-weight: 650; white-space: nowrap; }
.favorites-filter input { accent-color: var(--accent); }
.guide-note { margin: 14px 0; font-size: .83rem; }
.channels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.channel { min-width: 0; display: flex; flex-direction: column; padding: 17px; border: 1px solid var(--edge); border-radius: 14px; background: var(--surface); }
.channel-heading { display: flex; align-items: center; gap: 12px; min-width: 0; }
.emoji { display: grid; place-items: center; flex: 0 0 46px; height: 46px; font-size: 25px; background: #213a45; border-radius: 10px; }
.name { margin: 0; font-size: 1.02rem; }
.subtitle { color: var(--muted); margin-top: 3px; font-size: .83rem; }
.programme-guide { margin: 16px 0; padding-top: 12px; border-top: 1px solid var(--edge); font-size: .85rem; line-height: 1.55; }
.programme-guide div + div { margin-top: 5px; }
.programme-guide dt { display: inline; font-weight: 750; }
.programme-guide dd { display: inline; margin: 0; color: var(--muted); }
.access-status { margin: 0 0 12px; padding: 7px 9px; border-radius: 7px; background: #212f3b; font-size: .82rem; }
.access-status[data-state=allowed] { background: #123e35; color: #b0f1dc; }
.access-status[data-state=unavailable] { background: #3e2e1c; color: #ffe0ac; }
.card-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
.card-actions a, .channel .favorite { font-size: .83rem; }
.channel .favorite, .secondary { color: var(--accent); border-color: #446171; background: #152a37; }
.channel .favorite[aria-pressed=true] { background: #284d48; border-color: var(--accent); }
.message { margin-top: 14px; color: #ffe0ac; }
footer { border-top: 1px solid var(--edge); margin-top: 36px !important; padding: 18px 0 28px; color: var(--muted); font-size: .83rem; }
@media (max-width: 900px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .account { scroll-margin-top: 18px; }
    .account form { grid-template-columns: 1fr 1fr auto; align-items: end; }
}
@media (max-width: 560px) {
    .shell { width: calc(100% - 28px); }
    .top { min-height: 62px; }
    nav { gap: 10px; }
    .toolbar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .favorites-filter { grid-column: 1 / -1; }
    .account form { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<header class="site-header">
<div class="shell top">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">◉</span><span id="brand">TV launch preview</span></a>
    <nav aria-label="Main navigation"><a href="/catalog" aria-current="page">Catalog</a><a href="#account-panel">Account</a></nav>
</div>
</header>
<main class="shell">
<section class="intro" aria-labelledby="catalog-title">
    <h1 id="catalog-title">Channel catalog</h1>
    <p>Demo channels and schedules. Live playback is unavailable.</p>
</section>
<div class="workspace">
    <section class="catalog" aria-label="Browse channels">
        <div class="toolbar">
            <label class="field">Country<select id="country"><option value="US">United States</option><option value="NG">Nigeria</option></select></label>
            <label class="field">Search channels<input id="channel-search" type="search" placeholder="Name or category" maxlength="100"></label>
            <label class="favorites-filter"><input id="favorites-only" type="checkbox"> Favorites only</label>
        </div>
        <p class="guide-note">Programme times use your device’s time zone.</p>
        <section class="channels" id="channels" aria-label="Channel results"></section>
        <p class="message" id="message" role="status"></p>
        <button class="secondary" id="retry-catalog" type="button" hidden>Retry catalog</button>
        <p id="favorites-notice" role="status" hidden></p>
    </section>
    <section class="account" id="account-panel" aria-labelledby="account-title">
        <h2 id="account-title">Subscriber account</h2>
        <form id="sign-in">
            <label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
            <button type="submit">Sign in</button>
        </form>
        <button id="sign-out" type="button" hidden>Sign out</button>
        <div id="account" role="status"></div>
        <div id="plan-status" role="status" hidden></div>
    </section>
</div>
</main>
<footer class="shell"><a href="/">Back to the launch homepage</a></footer>
<script>
const country = document.querySelector('#country');
const initialCountry = new URLSearchParams(window.location.search).get('country');
if (initialCountry === 'US' || initialCountry === 'NG') country.value = initialCountry;
const channels = document.querySelector('#channels');
const message = document.querySelector('#message');
const retryCatalog = document.querySelector('#retry-catalog');
const form = document.querySelector('#sign-in');
const signOut = document.querySelector('#sign-out');
const account = document.querySelector('#account');
const planStatus = document.querySelector('#plan-status');
let accessToken = '';
let sessionTimer;
let catalogRequest = 0;
let guideTimer;
const search = document.querySelector('#channel-search');
const favoritesOnly = document.querySelector('#favorites-only');
const favoritesKey = 'iptv-demo-favorites';
const guestFavorites = readFavorites();
const favoritesNotice = document.querySelector('#favorites-notice');
const pendingFavorites = new Set();
let accountFavorites = null;

function currentFavorites() {
    return accessToken ? accountFavorites : guestFavorites;
}

function showFavoritesNotice(text) {
    favoritesNotice.textContent = text;
    favoritesNotice.hidden = !text;
}

async function loadAccountFavorites(token) {
    showFavoritesNotice('Loading account favorites…');
    try {
        const response = await fetch('/api/v1/subscriber/favorites', {
            headers: {Authorization: 'Bearer ' + token},
        });
        if (token !== accessToken) return;
        if (response.status === 401) {
            clearSession(token, 'Your session ended. Please sign in again.');
            return;
        }
        if (!response.ok) throw new Error('Favorites request failed');

        const saved = await response.json();
        if (token !== accessToken) return;
        accountFavorites = new Set(saved.channel_ids);
        showFavoritesNotice('');
        refreshFavoriteButtons();
        filterCatalog();
    } catch {
        if (token === accessToken) showFavoritesNotice('Unable to load favorites. Sign out and sign in to retry.');
    }
}

function readFavorites() {
    try {
        const saved = JSON.parse(localStorage.getItem(favoritesKey));
        return new Set(Array.isArray(saved) ? saved.filter(id => typeof id === 'string') : []);
    } catch {
        return new Set();
    }
}

function syncFavorite(button, channelId) {
    const favorites = currentFavorites();
    const saved = favorites?.has(channelId) ?? false;
    button.disabled = favorites === null || pendingFavorites.has(channelId);
    button.setAttribute('aria-pressed', String(saved));
    button.textContent = saved ? '★ Favorite' : '☆ Favorite';
}

function refreshFavoriteButtons() {
    for (const card of channels.children) {
        syncFavorite(card.querySelector('.favorite'), card.dataset.channelId);
    }
}

function filterCatalog() {
    const cards = Array.from(channels.children);
    if (!cards.length) return;

    const query = search.value.trim().toLowerCase();
    const favorites = currentFavorites();
    let visible = 0;
    for (const card of cards) {
        const matches = card.dataset.search.includes(query);
        const saved = favorites === null || favorites.has(card.dataset.channelId);
        card.hidden = !matches || (favoritesOnly.checked && !saved);
        if (!card.hidden) visible++;
    }

    message.textContent = visible
        ? ''
        : favoritesOnly.checked ? 'No favorites match this catalog and search.' : 'No channels match your search.';
}

function favoriteButton(channel) {
    const button = document.createElement('button');
    button.className = 'favorite';
    button.type = 'button';
    button.setAttribute('aria-label', 'Favorite ' + channel.name);
    syncFavorite(button, channel.id);
    button.addEventListener('click', async () => {
        const favorites = currentFavorites();
        if (favorites === null) return;
        const token = accessToken;
        const saving = !favorites.has(channel.id);
        showFavoritesNotice('');

        if (token) {
            pendingFavorites.add(channel.id);
            refreshFavoriteButtons();
            try {
                const response = await fetch(
                    '/api/v1/subscriber/favorites/' + encodeURIComponent(channel.id),
                    {
                        method: saving ? 'PUT' : 'DELETE',
                        headers: {Authorization: 'Bearer ' + token},
                    },
                );
                if (token !== accessToken) return;
                if (response.status === 401) {
                    clearSession(token, 'Your session ended. Please sign in again.');
                    return;
                }
                if (response.status !== 204) throw new Error('Favorite update failed');
            } catch {
                if (token === accessToken) showFavoritesNotice('Unable to update this favorite. Please try again.');
                return;
            } finally {
                if (token === accessToken) {
                    pendingFavorites.delete(channel.id);
                    refreshFavoriteButtons();
                }
            }
        }

        if (saving) favorites.add(channel.id);
        else favorites.delete(channel.id);
        refreshFavoriteButtons();
        filterCatalog();
        if (button.closest('article')?.hidden) favoritesOnly.focus();

        if (!token) {
            try {
                localStorage.setItem(favoritesKey, JSON.stringify([...favorites]));
            } catch {
                showFavoritesNotice('Browser storage is unavailable. Favorites will last until refresh.');
            }
        }
    });
    return button;
}
const guideTime = new Intl.DateTimeFormat(undefined, {hour: 'numeric', minute: '2-digit'});

function renderGuide(guide) {
    const list = document.createElement('dl');
    list.className = 'programme-guide';
    for (const [label, programme] of [['Now', guide.now], ['Next', guide.next]]) {
        const row = document.createElement('div');
        const name = document.createElement('dt');
        const detail = document.createElement('dd');
        name.textContent = label + ' · ';
        detail.textContent = programme.title + ' · ' + guideTime.format(new Date(programme.starts_at));
        row.append(name, detail);
        list.append(row);
    }
    return list;
}

function clearSession(token, notice) {
    if (token !== accessToken) return;
    clearTimeout(sessionTimer);
    accessToken = '';
    accountFavorites = null;
    pendingFavorites.clear();
    showFavoritesNotice('');
    signOut.hidden = true;
    form.hidden = false;
    planStatus.hidden = true;
    planStatus.textContent = '';
    account.textContent = notice;
    form.elements.namedItem('email').focus();
    loadCatalog();
}

async function loadProfile(token) {
    try {
        const response = await fetch('/api/v1/subscriber/me', {
            headers: {Authorization: 'Bearer ' + token},
        });
        if (token !== accessToken) return;
        if (response.status === 401) {
            clearSession(token, 'Your session ended. Please sign in again.');
            return;
        }
        if (!response.ok) throw new Error('Profile request failed');

        const profile = await response.json();
        if (token !== accessToken) return;
        account.textContent = 'Signed in as ' + profile.email;
        planStatus.textContent = profile.active_plans.length
            ? 'Active plans: ' + profile.active_plans.join(', ')
            : 'No active plans';
    } catch {
        if (token === accessToken) planStatus.textContent = 'Unable to load active plans.';
    }
}

async function channelStatus(channelId, region, token) {
    if (!token) return {text: 'Sign in to check channel access', state: 'guest'};

    const response = await fetch(
        '/api/v1/channels/' + encodeURIComponent(channelId) +
        '/eligibility?country=' + encodeURIComponent(region),
        {headers: {Authorization: 'Bearer ' + token}},
    );
    switch (response.status) {
        case 200: return {text: 'Covered by your plan', state: 'allowed'};
        case 403: return {text: 'Plan does not cover this channel', state: 'unavailable'};
        case 401:
            clearSession(token, 'Your session ended. Please sign in again.');
            return {text: 'Sign in to check channel access', state: 'guest'};
        default: return {text: 'Channel access could not be checked', state: 'unknown'};
    }
}

async function loadCatalog() {
    clearTimeout(guideTimer);
    const request = ++catalogRequest;
    const region = country.value;
    const token = accessToken;
    channels.replaceChildren();
    retryCatalog.hidden = true;
    message.textContent = 'Loading catalog…';

    try {
        const response = await fetch('/api/v1/channels?country=' + encodeURIComponent(region));
        if (!response.ok) throw new Error('Catalog request failed');
        const payload = await response.json();
        if (request !== catalogRequest) return;

        for (const channel of payload.channels) {
            const card = document.createElement('article');
            card.className = 'channel';
            card.dataset.channelId = channel.id;
            card.dataset.search = (channel.name + ' ' + channel.category).toLowerCase();
            const heading = document.createElement('div');
            heading.className = 'channel-heading';
            const icon = document.createElement('span');
            icon.className = 'emoji';
            icon.setAttribute('aria-hidden', 'true');
            icon.textContent = channel.icon;
            const description = document.createElement('div');
            const name = document.createElement('h2');
            name.className = 'name';
            name.textContent = channel.name;
            const category = document.createElement('div');
            category.className = 'subtitle';
            category.textContent = channel.category;
            description.append(name, category);
            heading.append(icon, description);
            const status = document.createElement('p');
            status.className = 'access-status';
            status.setAttribute('role', 'status');
            status.textContent = 'Checking access…';
            const scheduleLink = document.createElement('a');
            scheduleLink.href = '/catalog/channel?' + new URLSearchParams({channel_id: channel.id, country: region});
            scheduleLink.textContent = 'View schedule';
            scheduleLink.setAttribute('aria-label', 'View schedule for ' + channel.name);
            const actions = document.createElement('div');
            actions.className = 'card-actions';
            actions.append(scheduleLink, favoriteButton(channel));
            card.append(heading, renderGuide(channel.guide), status, actions);
            channels.append(card);
            channelStatus(channel.id, region, token)
                .then(result => {
                    status.textContent = result.text;
                    status.dataset.state = result.state;
                })
                .catch(() => { status.textContent = 'Channel access could not be checked'; });
        }
        const nextShow = payload.channels[0]?.guide.next.starts_at;
        if (nextShow) {
            guideTimer = setTimeout(loadCatalog, Math.max(30_000, Date.parse(nextShow) - Date.now() + 1000));
        }
        message.textContent = payload.channels.length ? '' : 'No demo channels are available.';
        filterCatalog();
    } catch {
        if (request === catalogRequest) {
            message.textContent = 'Unable to load the catalog. Check that the API is running.';
            retryCatalog.hidden = false;
        }
    }
}

form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('button');
    const password = form.elements.namedItem('password');
    button.disabled = true;
    account.textContent = 'Signing in…';

    try {
        const response = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: form.elements.namedItem('email').value, password: password.value}),
        });
        if (!response.ok) {
            if (response.status === 429) {
                account.textContent = 'Too many sign-in attempts. Try again in five minutes.';
            } else {
                account.textContent = response.status === 401 ? 'Check your email and password.' : 'Sign-in is temporarily unavailable.';
            }
            return;
        }

        const session = await response.json();
        const token = session.access_token;
        accessToken = token;
        form.hidden = true;
        signOut.hidden = false;
        account.textContent = 'Signed in.';
        planStatus.hidden = false;
        planStatus.textContent = 'Loading active plans…';
        sessionTimer = setTimeout(
            () => clearSession(token, 'Your session ended. Please sign in again.'),
            session.expires_in * 1000,
        );
        signOut.focus();
        loadProfile(token);
        loadAccountFavorites(token);
        loadCatalog();
    } catch {
        account.textContent = 'Unable to sign in. Check that the API is running.';
    } finally {
        password.value = '';
        button.disabled = false;
    }
});

signOut.addEventListener('click', async () => {
    const token = accessToken;
    signOut.disabled = true;
    account.textContent = 'Signing out…';

    try {
        const response = await fetch('/api/v1/auth/logout', {
            method: 'POST',
            headers: {Authorization: 'Bearer ' + token},
        });
        if (response.status !== 204) throw new Error('Sign-out request failed');
    } catch {
        if (token === accessToken) account.textContent = 'Unable to sign out. Please try again.';
        return;
    } finally {
        signOut.disabled = false;
    }

    clearSession(token, 'Signed out.');
});

country.addEventListener('change', () => {
    const url = new URL(window.location.href);
    url.searchParams.set('country', country.value);
    history.replaceState(null, '', url);
    loadCatalog();
});
retryCatalog.addEventListener('click', loadCatalog);
search.addEventListener('input', filterCatalog);
favoritesOnly.addEventListener('change', filterCatalog);
fetch('/api/v1/config')
    .then(response => response.ok ? response.json() : null)
    .then(config => { if (config && config.brand !== 'YOUR IPTV BRAND') document.querySelector('#brand').textContent = config.brand; })
    .catch(() => {});
loadCatalog();
</script></body></html>
